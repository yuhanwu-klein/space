<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box to Sphere Animation</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        canvas {
            display: block;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 5px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Scene setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Load background texture
        const textureLoader = new THREE.TextureLoader();
        textureLoader.load('background.png', function(texture) {
            scene.background = texture;
        });

        // Create box geometry
        const boxGeometry = new THREE.BoxGeometry(2, 2, 2);
        const sphereGeometry = new THREE.SphereGeometry(1.4, 32, 32);

        // Load surface texture for cube and sphere
        let material;
        let meshes = []; // Array to hold three meshes
        const meshCount = 3;

        // Function to create meshes with or without texture
        function createMeshes(texture) {
            if (texture) {
                // Create transparent material with texture
                material = new THREE.MeshPhongMaterial({
                    map: texture,
                    transparent: true,
                    opacity: 0.8,
                    side: THREE.DoubleSide
                });
            } else {
                // Fallback to colored material if texture fails to load
                material = new THREE.MeshPhongMaterial({
                    color: 0x00ffff,
                    transparent: true,
                    opacity: 0.6,
                    side: THREE.DoubleSide
                });
            }

            // Small sphere geometry for inner spheres
            const smallSphereGeometry = new THREE.SphereGeometry(0.6, 32, 32);

            // Metallic colors for inner spheres
            const metallicColors = [0x0066ff, 0xffdd00, 0xff3333]; // Blue, Yellow, Red

            // Create three meshes with box geometry initially
            for (let i = 0; i < meshCount; i++) {
                const mesh = new THREE.Mesh(boxGeometry, material.clone());

                // Create small metallic sphere inside the box
                const metallicMaterial = new THREE.MeshStandardMaterial({
                    color: metallicColors[i],
                    metalness: 0.9,
                    roughness: 0.2,
                    emissive: metallicColors[i],
                    emissiveIntensity: 0.2
                });

                const innerSphere = new THREE.Mesh(smallSphereGeometry, metallicMaterial);
                innerSphere.position.set(0, 0, 0); // Center inside the box

                // Add sphere as child of box so it moves with it
                mesh.add(innerSphere);

                meshes.push(mesh);
                scene.add(mesh);
            }
        }

        // Try to load texture, fallback to color if it fails
        textureLoader.load(
            'WechatIMG543.jpg',
            function(texture) {
                // Success - create meshes with texture
                createMeshes(texture);
                console.log('Texture loaded successfully');
            },
            undefined,
            function(error) {
                // Error - create meshes with fallback color
                console.warn('Texture failed to load, using fallback color');
                createMeshes(null);
            }
        );

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0xffffff, 1);
        pointLight.position.set(5, 5, 5);
        scene.add(pointLight);

        const pointLight2 = new THREE.PointLight(0xff00ff, 0.5);
        pointLight2.position.set(-5, -5, -5);
        scene.add(pointLight2);

        camera.position.z = 5;

        // Create bright stars in the background
        function createStars() {
            const starGeometry = new THREE.SphereGeometry(0.05, 8, 8);
            const starCount = 200;

            for (let i = 0; i < starCount; i++) {
                // Random bright colors for stars
                const colors = [0xffffff, 0xffffaa, 0xaaffff, 0xffaaff];
                const starColor = colors[Math.floor(Math.random() * colors.length)];

                const starMaterial = new THREE.MeshBasicMaterial({
                    color: starColor,
                    transparent: true,
                    opacity: 0.6 + Math.random() * 0.4
                });

                const star = new THREE.Mesh(starGeometry, starMaterial);

                // Random position in a sphere around the scene
                const distance = 10 + Math.random() * 20;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.random() * Math.PI;

                star.position.x = distance * Math.sin(phi) * Math.cos(theta);
                star.position.y = distance * Math.sin(phi) * Math.sin(theta);
                star.position.z = distance * Math.cos(phi);

                // Random scale for variation
                const scale = 0.5 + Math.random() * 1.5;
                star.scale.set(scale, scale, scale);

                scene.add(star);
            }
        }

        createStars();

        // Animation state
        let time = 0;
        let isSphere = [false, false, false]; // Track which meshes are spheres
        let isFading = [false, false, false]; // Track which meshes are fading out
        let fadeProgress = [1.0, 1.0, 1.0]; // Opacity for each mesh (1.0 = fully visible)
        let isMetallicOnly = [false, false, false]; // Track which are standalone metallic spheres
        let isAligning = false; // Track if alignment is in progress
        let alignProgress = 0; // Progress of alignment animation (0 to 1)
        let startPositions = []; // Starting positions for alignment
        let targetPositions = []; // Target positions for vertical alignment

        // Raycaster for click detection
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function onMouseClick(event) {
            if (meshes.length === 0) return; // Wait for meshes to load

            // Calculate mouse position in normalized device coordinates
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            // Update the raycaster
            raycaster.setFromCamera(mouse, camera);

            // Check for intersections with all meshes
            const intersects = raycaster.intersectObjects(meshes);

            if (intersects.length > 0) {
                // Find which mesh was clicked
                const clickedMesh = intersects[0].object;
                const meshIndex = meshes.indexOf(clickedMesh);

                if (meshIndex !== -1 && !isSphere[meshIndex]) {
                    // Only transform cube to sphere (not sphere back to cube)
                    isSphere[meshIndex] = true;

                    // Get the current material and inner sphere
                    const currentMaterial = clickedMesh.material;
                    const innerSphere = clickedMesh.children[0]; // Get the metallic sphere inside

                    // Remove old mesh
                    scene.remove(clickedMesh);

                    // Create new mesh with sphere geometry
                    const newMesh = new THREE.Mesh(sphereGeometry, currentMaterial);

                    // Re-add the inner sphere
                    if (innerSphere) {
                        newMesh.add(innerSphere);
                    }

                    // Copy position, rotation, and scale from old mesh
                    newMesh.position.copy(clickedMesh.position);
                    newMesh.rotation.copy(clickedMesh.rotation);
                    newMesh.scale.copy(clickedMesh.scale);

                    // Replace in array and add to scene
                    meshes[meshIndex] = newMesh;
                    scene.add(newMesh);

                    // Start fade-out animation
                    isFading[meshIndex] = true;
                }
            }
        }

        window.addEventListener('click', onMouseClick);

        // Handle window resize
        window.addEventListener('resize', function() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            if (meshes.length === 0) {
                renderer.render(scene, camera);
                return; // Wait for texture to load
            }

            time += 0.016; // ~60fps

            const radius = 2.5;
            const orbitSpeed = 0.5; // Slower orbital speed

            // Handle alignment animation
            if (isAligning) {
                alignProgress += 0.01; // Alignment speed

                if (alignProgress >= 1) {
                    alignProgress = 1;
                    // Keep them at target positions after alignment
                    for (let i = 0; i < meshes.length; i++) {
                        if (isMetallicOnly[i]) {
                            meshes[i].position.copy(targetPositions[i]);
                        }
                    }
                } else {
                    // Interpolate positions
                    for (let i = 0; i < meshes.length; i++) {
                        if (isMetallicOnly[i]) {
                            meshes[i].position.lerpVectors(
                                startPositions[i],
                                targetPositions[i],
                                alignProgress
                            );
                        }
                    }
                }
            }

            // Three circles orbital dance (only for non-aligned meshes)
            for (let i = 0; i < meshes.length; i++) {
                const mesh = meshes[i];

                // Only animate orbit if not a metallic sphere or still aligning
                if (!isMetallicOnly[i] || (isMetallicOnly[i] && alignProgress < 1)) {
                    const angleOffset = (i * Math.PI * 2) / meshCount;

                    // Circular orbit around center
                    if (!isMetallicOnly[i]) {
                        mesh.position.x = Math.cos(time * orbitSpeed + angleOffset) * radius;
                        mesh.position.y = Math.sin(time * orbitSpeed + angleOffset) * radius;
                        mesh.position.z = Math.sin(time * orbitSpeed * 0.5 + angleOffset) * 1.0 - 0.5;
                    }
                }

                // Individual rotation - slower
                mesh.rotation.x += 0.003;
                mesh.rotation.y += 0.005;
                mesh.rotation.z += 0.002;

                // Scale animation (continue for aligned spheres too)
                const pulse = 0.8 + Math.sin(time * 3 + i) * 0.2;
                mesh.scale.set(pulse, pulse, pulse);

                // Handle fade-out animation
                if (isFading[i]) {
                    fadeProgress[i] -= 0.015; // Fade speed

                    if (fadeProgress[i] <= 0) {
                        fadeProgress[i] = 0;
                        isFading[i] = false;

                        // Detach inner metallic sphere
                        const innerSphere = mesh.children[0];
                        if (innerSphere) {
                            // Get world position, rotation, and scale before detaching
                            const worldPosition = new THREE.Vector3();
                            const worldQuaternion = new THREE.Quaternion();
                            const worldScale = new THREE.Vector3();
                            mesh.getWorldPosition(worldPosition);
                            mesh.getWorldQuaternion(worldQuaternion);
                            mesh.getWorldScale(worldScale);

                            // Remove from parent
                            mesh.remove(innerSphere);

                            // Apply world transforms
                            innerSphere.position.copy(worldPosition);
                            innerSphere.quaternion.copy(worldQuaternion);
                            innerSphere.scale.copy(worldScale);

                            // Remove outer mesh and replace with inner sphere
                            scene.remove(mesh);
                            meshes[i] = innerSphere;
                            scene.add(innerSphere);

                            // Mark as metallic only
                            isMetallicOnly[i] = true;

                            // Check if all three are now metallic only
                            if (isMetallicOnly[0] && isMetallicOnly[1] && isMetallicOnly[2] && !isAligning) {
                                // Start alignment animation
                                isAligning = true;
                                alignProgress = 0;

                                // Store starting positions
                                startPositions = [
                                    meshes[0].position.clone(),
                                    meshes[1].position.clone(),
                                    meshes[2].position.clone()
                                ];

                                // Set target positions (vertical line)
                                targetPositions = [
                                    new THREE.Vector3(0, 2, 0),    // Top
                                    new THREE.Vector3(0, 0, 0),    // Middle
                                    new THREE.Vector3(0, -2, 0)    // Bottom
                                ];
                            }
                        } else {
                            // If no inner sphere, just hide outer mesh
                            mesh.visible = false;
                        }
                    } else {
                        // Update material opacity
                        mesh.material.opacity = fadeProgress[i] * 0.8; // Original opacity was 0.8
                    }
                }
            }

            // Camera looks at center
            camera.position.x = 0;
            camera.position.y = 0;
            camera.position.z = 5;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
