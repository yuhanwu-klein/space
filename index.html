<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box to Sphere Animation</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        canvas {
            display: block;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 5px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Scene setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Load background texture
        const textureLoader = new THREE.TextureLoader();
        textureLoader.load('background.png', function(texture) {
            scene.background = texture;
        });

        // Create box geometry
        const boxGeometry = new THREE.BoxGeometry(2, 2, 2);
        const sphereGeometry = new THREE.SphereGeometry(1.4, 32, 32);

        // Load surface texture for cube and sphere
        let material;
        let meshes = []; // Array to hold three meshes
        const meshCount = 3;

        // Function to create meshes with or without texture
        function createMeshes(texture) {
            if (texture) {
                // Create transparent material with texture
                material = new THREE.MeshPhongMaterial({
                    map: texture,
                    transparent: true,
                    opacity: 0.8,
                    side: THREE.DoubleSide
                });
            } else {
                // Fallback to colored material if texture fails to load
                material = new THREE.MeshPhongMaterial({
                    color: 0x00ffff,
                    transparent: true,
                    opacity: 0.6,
                    side: THREE.DoubleSide
                });
            }

            // Small sphere geometry for inner spheres
            const smallSphereGeometry = new THREE.SphereGeometry(0.6, 32, 32);

            // Metallic colors for inner spheres
            const metallicColors = [0x0066ff, 0xffdd00, 0xff3333]; // Blue, Yellow, Red

            // Create three meshes with box geometry initially
            for (let i = 0; i < meshCount; i++) {
                const mesh = new THREE.Mesh(boxGeometry, material.clone());

                // Create small metallic sphere inside the box
                const metallicMaterial = new THREE.MeshStandardMaterial({
                    color: metallicColors[i],
                    metalness: 0.9,
                    roughness: 0.2,
                    emissive: metallicColors[i],
                    emissiveIntensity: 0.2
                });

                const innerSphere = new THREE.Mesh(smallSphereGeometry, metallicMaterial);
                innerSphere.position.set(0, 0, 0); // Center inside the box

                // Add sphere as child of box so it moves with it
                mesh.add(innerSphere);

                meshes.push(mesh);
                scene.add(mesh);
            }
        }

        // Try to load texture, fallback to color if it fails
        textureLoader.load(
            'WechatIMG543.jpg',
            function(texture) {
                // Success - create meshes with texture
                createMeshes(texture);
                console.log('Texture loaded successfully');
            },
            undefined,
            function(error) {
                // Error - create meshes with fallback color
                console.warn('Texture failed to load, using fallback color');
                createMeshes(null);
            }
        );

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0xffffff, 1);
        pointLight.position.set(5, 5, 5);
        scene.add(pointLight);

        const pointLight2 = new THREE.PointLight(0xff00ff, 0.5);
        pointLight2.position.set(-5, -5, -5);
        scene.add(pointLight2);

        // Create aurora lights - multiple colored lights that move like northern lights
        const auroraLights = [];
        const auroraColors = [
            0x00ff88, // Green
            0x0088ff, // Blue
            0xff00ff, // Purple/Magenta
            0x00ffff, // Cyan
            0xff0088, // Pink
            0x88ff00  // Yellow-green
        ];

        for (let i = 0; i < 6; i++) {
            const auroraLight = new THREE.PointLight(auroraColors[i], 0, 8);

            // Initial positions spread around the scene
            const angle = (i / 6) * Math.PI * 2;
            auroraLight.position.x = Math.cos(angle) * 6;
            auroraLight.position.y = Math.sin(angle) * 4;
            auroraLight.position.z = -2 + (i % 3) * 2;

            // Store initial phase for wave animation
            auroraLight.userData.phaseX = Math.random() * Math.PI * 2;
            auroraLight.userData.phaseY = Math.random() * Math.PI * 2;
            auroraLight.userData.phaseZ = Math.random() * Math.PI * 2;
            auroraLight.userData.speedX = 0.3 + Math.random() * 0.3;
            auroraLight.userData.speedY = 0.4 + Math.random() * 0.4;
            auroraLight.userData.speedZ = 0.2 + Math.random() * 0.2;
            auroraLight.userData.intensityPhase = Math.random() * Math.PI * 2;

            scene.add(auroraLight);
            auroraLights.push(auroraLight);
        }

        camera.position.z = 5;

        // Create bright stars in the background
        function createStars() {
            const starGeometry = new THREE.SphereGeometry(0.05, 8, 8);
            const starCount = 200;

            for (let i = 0; i < starCount; i++) {
                // Random bright colors for stars
                const colors = [0xffffff, 0xffffaa, 0xaaffff, 0xffaaff];
                const starColor = colors[Math.floor(Math.random() * colors.length)];

                const starMaterial = new THREE.MeshBasicMaterial({
                    color: starColor,
                    transparent: true,
                    opacity: 0.6 + Math.random() * 0.4
                });

                const star = new THREE.Mesh(starGeometry, starMaterial);

                // Random position in a sphere around the scene
                const distance = 10 + Math.random() * 20;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.random() * Math.PI;

                star.position.x = distance * Math.sin(phi) * Math.cos(theta);
                star.position.y = distance * Math.sin(phi) * Math.sin(theta);
                star.position.z = distance * Math.cos(phi);

                // Random scale for variation
                const scale = 0.5 + Math.random() * 1.5;
                star.scale.set(scale, scale, scale);

                scene.add(star);
            }
        }

        createStars();

        // Animation state
        let time = 0;
        let isSphere = [false, false, false]; // Track which meshes are spheres
        let isFading = [false, false, false]; // Track which meshes are fading out
        let fadeProgress = [1.0, 1.0, 1.0]; // Opacity for each mesh (1.0 = fully visible)
        let isMetallicOnly = [false, false, false]; // Track which are standalone metallic spheres
        let isAligning = false; // Track if alignment is in progress
        let alignProgress = 0; // Progress of alignment animation (0 to 1)
        let startPositions = []; // Starting positions for alignment
        let targetPositions = []; // Target positions for vertical alignment

        // Zodiac transformation state
        let isBouncing = [false, false, false]; // Track if each sphere is bouncing
        let bounceProgress = [0, 0, 0]; // Progress of bounce animation for each sphere
        let bounceStartY = [0, 0, 0]; // Starting Y position for bounce for each sphere
        let isTransformingToZodiac = [false, false, false]; // Track zodiac transformation
        let zodiacTransformProgress = [0, 0, 0]; // Progress of zodiac transformation (0 to 1)
        let zodiacParticles = [[], [], []]; // Particle systems for each zodiac
        let zodiacLights = [null, null, null]; // Point lights for zodiac glow
        let particleGeometry = new THREE.SphereGeometry(0.03, 8, 8); // Shared geometry for particles

        // Raycaster for click detection
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        // Create zodiac particle patterns
        function createZodiacParticles(zodiacType, color, centerPosition) {
            const particles = [];
            const particleCount = 250; // Increased for denser, more impressive patterns

            // Generate particle positions based on zodiac type
            for (let i = 0; i < particleCount; i++) {
                // Create varied particle sizes for depth and sparkle effect
                const isCoreStar = i % 5 === 0; // Every 5th particle is a larger core star
                const isSparkleStar = i % 3 === 0; // Every 3rd particle sparkles more
                const particleSize = isCoreStar ? 0.05 : (isSparkleStar ? 0.035 : 0.025);

                const starGeometry = new THREE.SphereGeometry(particleSize, 8, 8);

                // Create color variations for more depth
                const baseColor = new THREE.Color(color);
                const colorVariation = 0.3;
                const variedColor = baseColor.clone();
                variedColor.r += (Math.random() - 0.5) * colorVariation;
                variedColor.g += (Math.random() - 0.5) * colorVariation;
                variedColor.b += (Math.random() - 0.5) * colorVariation;

                // Use emissive material for glowing star effect
                const material = new THREE.MeshStandardMaterial({
                    color: variedColor,
                    emissive: variedColor,
                    emissiveIntensity: isCoreStar ? 1.5 : 1.0,
                    metalness: 0.5,
                    roughness: 0.3,
                    transparent: true,
                    opacity: 0
                });

                const particle = new THREE.Mesh(starGeometry, material);

                let targetX, targetY, targetZ;

                if (zodiacType === 'pisces') {
                    // Two fish curves facing opposite directions - enhanced pattern
                    const t = i / particleCount;
                    const angle = t * Math.PI * 2;
                    const fishIndex = i < particleCount / 2 ? 0 : 1;

                    if (fishIndex === 0) {
                        // First fish (upper curve) - more detailed
                        const radius = 0.8 + Math.sin(angle * 3) * 0.15;
                        targetX = Math.cos(angle) * radius - 0.3;
                        targetY = Math.sin(angle) * 0.5 + 0.4;
                        // Add tail details
                        if (angle > Math.PI * 1.5) {
                            targetX -= (angle - Math.PI * 1.5) * 0.4;
                            targetY += Math.sin((angle - Math.PI * 1.5) * 5) * 0.15;
                        }
                    } else {
                        // Second fish (lower curve) - more detailed
                        const radius = 0.8 + Math.sin(angle * 3) * 0.15;
                        targetX = Math.cos(angle + Math.PI) * radius + 0.3;
                        targetY = Math.sin(angle + Math.PI) * 0.5 - 0.4;
                        // Add tail details
                        if (angle < Math.PI * 0.5) {
                            targetX += angle * 0.4;
                            targetY -= Math.sin(angle * 5) * 0.15;
                        }
                    }
                    targetZ = Math.sin(angle * 2) * 0.25;

                } else if (zodiacType === 'taurus') {
                    // Bull head with horns - enhanced with more details
                    const t = i / particleCount;

                    if (i < particleCount * 0.5) {
                        // Circle for head with facial features
                        const angle = t * Math.PI * 2 * 2;
                        const radius = 0.6 + Math.sin(angle * 4) * 0.08;
                        targetX = Math.cos(angle) * radius;
                        targetY = Math.sin(angle) * radius - 0.2;
                        targetZ = Math.cos(angle * 2) * 0.1;
                    } else if (i < particleCount * 0.7) {
                        // Left horn - curved spiral
                        const hornT = (i - particleCount * 0.5) / (particleCount * 0.2);
                        const spiralAngle = hornT * Math.PI * 1.5;
                        targetX = -0.5 - hornT * 0.6 + Math.cos(spiralAngle) * 0.15;
                        targetY = 0.3 + hornT * 0.8;
                        targetZ = Math.sin(spiralAngle) * 0.25;
                    } else {
                        // Right horn - curved spiral
                        const hornT = (i - particleCount * 0.7) / (particleCount * 0.3);
                        const spiralAngle = hornT * Math.PI * 1.5;
                        targetX = 0.5 + hornT * 0.6 - Math.cos(spiralAngle) * 0.15;
                        targetY = 0.3 + hornT * 0.8;
                        targetZ = Math.sin(spiralAngle) * 0.25;
                    }

                } else if (zodiacType === 'aries') {
                    // Ram horns - enhanced spiral pattern
                    const t = i / particleCount;

                    if (i < particleCount * 0.2) {
                        // Center head/face
                        const vT = t * 5;
                        targetX = Math.sin(vT * Math.PI * 2) * 0.15;
                        targetY = -vT * 0.6;
                        targetZ = Math.cos(vT * Math.PI * 2) * 0.1;
                    } else if (i < particleCount * 0.6) {
                        // Left spiral horn
                        const hornT = (i - particleCount * 0.2) / (particleCount * 0.4);
                        const spiralAngle = hornT * Math.PI * 4;
                        const spiralRadius = 0.3 + hornT * 0.4;
                        targetX = -0.4 - hornT * 0.5 + Math.cos(spiralAngle) * spiralRadius;
                        targetY = hornT * 0.6 + Math.sin(spiralAngle) * spiralRadius * 0.5;
                        targetZ = Math.sin(spiralAngle * 1.5) * 0.3;
                    } else {
                        // Right spiral horn
                        const hornT = (i - particleCount * 0.6) / (particleCount * 0.4);
                        const spiralAngle = hornT * Math.PI * 4;
                        const spiralRadius = 0.3 + hornT * 0.4;
                        targetX = 0.4 + hornT * 0.5 - Math.cos(spiralAngle) * spiralRadius;
                        targetY = hornT * 0.6 + Math.sin(spiralAngle) * spiralRadius * 0.5;
                        targetZ = Math.sin(spiralAngle * 1.5) * 0.3;
                    }
                }

                // Store target position
                particle.userData.targetPosition = new THREE.Vector3(
                    centerPosition.x + targetX,
                    centerPosition.y + targetY,
                    centerPosition.z + targetZ
                );

                // Start from center position with random offset
                particle.position.copy(centerPosition);
                particle.position.x += (Math.random() - 0.5) * 0.4;
                particle.position.y += (Math.random() - 0.5) * 0.4;
                particle.position.z += (Math.random() - 0.5) * 0.4;

                // Add glow and twinkle effects
                particle.userData.glowPhase = Math.random() * Math.PI * 2;
                particle.userData.twinkleSpeed = 2 + Math.random() * 3;
                particle.userData.twinkleOffset = Math.random() * Math.PI * 2;
                particle.userData.isCoreStar = isCoreStar;
                particle.userData.isSparkleStar = isSparkleStar;
                particle.userData.baseEmissiveIntensity = isCoreStar ? 1.5 : 1.0;

                scene.add(particle);
                particles.push(particle);
            }

            return particles;
        }

        function onMouseClick(event) {
            if (meshes.length === 0) return; // Wait for meshes to load

            // Calculate mouse position in normalized device coordinates
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            // Update the raycaster
            raycaster.setFromCamera(mouse, camera);

            // Check for intersections with all meshes
            const intersects = raycaster.intersectObjects(meshes);

            if (intersects.length > 0) {
                // Find which mesh was clicked
                const clickedMesh = intersects[0].object;
                const meshIndex = meshes.indexOf(clickedMesh);

                if (meshIndex !== -1) {
                    // Check if clicking on aligned metallic sphere to trigger zodiac transformation
                    if (isMetallicOnly[meshIndex] && alignProgress >= 1 && !isBouncing[meshIndex] && !isTransformingToZodiac[meshIndex]) {
                        // Trigger zodiac transformation for this specific sphere
                        isBouncing[meshIndex] = true;
                        bounceProgress[meshIndex] = 0;
                        bounceStartY[meshIndex] = meshes[meshIndex].position.y;

                        const zodiacNames = ['Pisces', 'Taurus', 'Aries'];
                        console.log(`Starting ${zodiacNames[meshIndex]} transformation`);
                    } else if (!isSphere[meshIndex]) {
                        // Only transform cube to sphere (not sphere back to cube)
                        isSphere[meshIndex] = true;

                        // Get the current material and inner sphere
                        const currentMaterial = clickedMesh.material;
                        const innerSphere = clickedMesh.children[0]; // Get the metallic sphere inside

                        // Remove old mesh
                        scene.remove(clickedMesh);

                        // Create new mesh with sphere geometry
                        const newMesh = new THREE.Mesh(sphereGeometry, currentMaterial);

                        // Re-add the inner sphere
                        if (innerSphere) {
                            newMesh.add(innerSphere);
                        }

                        // Copy position, rotation, and scale from old mesh
                        newMesh.position.copy(clickedMesh.position);
                        newMesh.rotation.copy(clickedMesh.rotation);
                        newMesh.scale.copy(clickedMesh.scale);

                        // Replace in array and add to scene
                        meshes[meshIndex] = newMesh;
                        scene.add(newMesh);

                        // Start fade-out animation
                        isFading[meshIndex] = true;
                    }
                }
            }
        }

        window.addEventListener('click', onMouseClick);

        // Handle window resize
        window.addEventListener('resize', function() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            if (meshes.length === 0) {
                renderer.render(scene, camera);
                return; // Wait for texture to load
            }

            time += 0.016; // ~60fps

            const radius = 2.5;
            const orbitSpeed = 0.5; // Slower orbital speed

            // Handle alignment animation
            if (isAligning) {
                alignProgress += 0.01; // Alignment speed

                if (alignProgress >= 1) {
                    alignProgress = 1;
                    // Keep them at target positions after alignment
                    for (let i = 0; i < meshes.length; i++) {
                        if (isMetallicOnly[i]) {
                            meshes[i].position.copy(targetPositions[i]);
                        }
                    }
                } else {
                    // Interpolate positions
                    for (let i = 0; i < meshes.length; i++) {
                        if (isMetallicOnly[i]) {
                            meshes[i].position.lerpVectors(
                                startPositions[i],
                                targetPositions[i],
                                alignProgress
                            );
                        }
                    }
                }
            }

            // Handle bounce animation for each sphere individually
            const zodiacTypes = ['pisces', 'taurus', 'aries'];
            const colors = [0x0066ff, 0xffdd00, 0xff3333];

            for (let i = 0; i < 3; i++) {
                if (isBouncing[i]) {
                    bounceProgress[i] += 0.02; // Bounce speed

                    if (bounceProgress[i] >= 1) {
                        // Bounce complete - start zodiac transformation for this sphere
                        isBouncing[i] = false;
                        bounceProgress[i] = 0;

                        // Start transforming this sphere to zodiac pattern
                        isTransformingToZodiac[i] = true;

                        // Create zodiac particles for this sphere
                        zodiacParticles[i] = createZodiacParticles(
                            zodiacTypes[i],
                            colors[i],
                            meshes[i].position
                        );

                        // Create glowing point light for this zodiac
                        zodiacLights[i] = new THREE.PointLight(colors[i], 0, 3);
                        zodiacLights[i].position.copy(meshes[i].position);
                        scene.add(zodiacLights[i]);

                        console.log(`${zodiacTypes[i]} transformation started`);
                    } else {
                        // Bounce up and down (3 bounces)
                        const numBounces = 3;
                        const bounceHeight = 1.5;
                        const bounceY = Math.abs(Math.sin(bounceProgress[i] * Math.PI * numBounces)) * bounceHeight;

                        meshes[i].position.y = bounceStartY[i] + bounceY;
                    }
                }
            }

            // Handle zodiac transformation animation
            for (let i = 0; i < 3; i++) {
                if (isTransformingToZodiac[i]) {
                    zodiacTransformProgress[i] += 0.008; // Slow transformation

                    if (zodiacTransformProgress[i] >= 1) {
                        zodiacTransformProgress[i] = 1;

                        // Fade out the sphere completely
                        if (meshes[i].material.opacity > 0) {
                            meshes[i].material.opacity = 0;
                            meshes[i].visible = false;
                        }

                        // Keep particles at full opacity with enhanced glow and twinkle
                        for (let j = 0; j < zodiacParticles[i].length; j++) {
                            const particle = zodiacParticles[i][j];

                            // Enhanced twinkling effect - different speeds for different particles
                            const twinkle = Math.sin(time * particle.userData.twinkleSpeed + particle.userData.twinkleOffset);
                            const baseTwinkle = 0.6 + twinkle * 0.4;

                            // Core stars are brighter and pulse more dramatically
                            if (particle.userData.isCoreStar) {
                                particle.material.opacity = baseTwinkle * 1.0;
                                particle.material.emissiveIntensity = particle.userData.baseEmissiveIntensity * (1.0 + twinkle * 0.8);

                                // Add scale pulsing for core stars
                                const scalePulse = 1.0 + Math.sin(time * 4 + particle.userData.glowPhase) * 0.3;
                                particle.scale.set(scalePulse, scalePulse, scalePulse);
                            } else if (particle.userData.isSparkleStar) {
                                // Sparkle stars have rapid twinkling
                                particle.material.opacity = baseTwinkle * 0.9;
                                particle.material.emissiveIntensity = particle.userData.baseEmissiveIntensity * (1.0 + twinkle * 0.6);

                                const scalePulse = 1.0 + Math.sin(time * 6 + particle.userData.glowPhase) * 0.2;
                                particle.scale.set(scalePulse, scalePulse, scalePulse);
                            } else {
                                // Regular stars have gentle glow
                                particle.material.opacity = baseTwinkle * 0.8;
                                particle.material.emissiveIntensity = particle.userData.baseEmissiveIntensity * (1.0 + twinkle * 0.4);
                            }

                            // Add slight rotation to zodiac pattern
                            const angle = time * 0.3;
                            const targetPos = particle.userData.targetPosition;
                            const centerPos = meshes[i].position;
                            const dx = targetPos.x - centerPos.x;
                            const dy = targetPos.y - centerPos.y;

                            particle.position.x = centerPos.x + dx * Math.cos(angle) - dy * Math.sin(angle);
                            particle.position.y = centerPos.y + dx * Math.sin(angle) + dy * Math.cos(angle);

                            // Enhanced floating motion with varied depth
                            const floatSpeed = particle.userData.isCoreStar ? 2 : 3;
                            const floatAmount = particle.userData.isCoreStar ? 0.15 : 0.08;
                            particle.position.z = targetPos.z + Math.sin(time * floatSpeed + j * 0.1) * floatAmount;

                            // Add slight individual movement for sparkle effect
                            if (particle.userData.isSparkleStar) {
                                particle.position.x += Math.sin(time * 4 + j) * 0.015;
                                particle.position.y += Math.cos(time * 4 + j * 1.3) * 0.015;
                            }
                        }

                        // Animate the zodiac glow light
                        if (zodiacLights[i]) {
                            zodiacLights[i].position.copy(meshes[i].position);
                            // Pulsing light intensity for magical glow effect
                            const lightPulse = Math.sin(time * 2) * 0.5 + 0.5;
                            zodiacLights[i].intensity = 1.5 + lightPulse * 1.5;
                        }
                    } else {
                        // Animate transformation
                        const progress = zodiacTransformProgress[i];

                        // Fade out sphere
                        meshes[i].material.transparent = true;
                        meshes[i].material.opacity = 1 - progress;

                        // Fade in zodiac light
                        if (zodiacLights[i]) {
                            zodiacLights[i].position.copy(meshes[i].position);
                            zodiacLights[i].intensity = progress * 2;
                        }

                        // Fade in and move particles to target positions
                        for (let j = 0; j < zodiacParticles[i].length; j++) {
                            const particle = zodiacParticles[i][j];
                            const startPos = meshes[i].position;
                            const targetPos = particle.userData.targetPosition;

                            // Smooth interpolation with easing
                            const easeProgress = 1 - Math.pow(1 - progress, 3); // Ease out cubic

                            particle.position.lerpVectors(startPos, targetPos, easeProgress);

                            // Enhanced fade in with different timing for different star types
                            if (particle.userData.isCoreStar) {
                                particle.material.opacity = Math.min(1.0, progress * 1.3);
                                particle.material.emissiveIntensity = progress * particle.userData.baseEmissiveIntensity;
                            } else {
                                particle.material.opacity = progress * 0.8;
                                particle.material.emissiveIntensity = progress * particle.userData.baseEmissiveIntensity;
                            }

                            // Add some particle movement during transition with sparkle
                            const sparkle = Math.sin(time * 10 + j) * 0.5 + 0.5;
                            particle.position.x += Math.sin(time * 5 + j) * 0.02 * (1 - progress) * sparkle;
                            particle.position.y += Math.cos(time * 5 + j) * 0.02 * (1 - progress) * sparkle;
                        }
                    }
                }
            }

            // Three circles orbital dance (only for non-aligned meshes)
            for (let i = 0; i < meshes.length; i++) {
                const mesh = meshes[i];

                // Skip animation if transforming to zodiac
                if (isTransformingToZodiac[i]) continue;

                // Only animate orbit if not a metallic sphere or still aligning
                if (!isMetallicOnly[i] || (isMetallicOnly[i] && alignProgress < 1)) {
                    const angleOffset = (i * Math.PI * 2) / meshCount;

                    // Circular orbit around center
                    if (!isMetallicOnly[i]) {
                        mesh.position.x = Math.cos(time * orbitSpeed + angleOffset) * radius;
                        mesh.position.y = Math.sin(time * orbitSpeed + angleOffset) * radius;
                        mesh.position.z = Math.sin(time * orbitSpeed * 0.5 + angleOffset) * 1.0 - 0.5;
                    }
                }

                // Individual rotation - slower (skip if this sphere is bouncing)
                if (!isBouncing[i]) {
                    mesh.rotation.x += 0.003;
                    mesh.rotation.y += 0.005;
                    mesh.rotation.z += 0.002;
                }

                // Scale animation (continue for aligned spheres too, skip if this sphere is bouncing)
                if (!isBouncing[i]) {
                    const pulse = 0.8 + Math.sin(time * 3 + i) * 0.2;
                    mesh.scale.set(pulse, pulse, pulse);
                }

                // Handle fade-out animation
                if (isFading[i]) {
                    fadeProgress[i] -= 0.015; // Fade speed

                    if (fadeProgress[i] <= 0) {
                        fadeProgress[i] = 0;
                        isFading[i] = false;

                        // Detach inner metallic sphere
                        const innerSphere = mesh.children[0];
                        if (innerSphere) {
                            // Get world position, rotation, and scale before detaching
                            const worldPosition = new THREE.Vector3();
                            const worldQuaternion = new THREE.Quaternion();
                            const worldScale = new THREE.Vector3();
                            mesh.getWorldPosition(worldPosition);
                            mesh.getWorldQuaternion(worldQuaternion);
                            mesh.getWorldScale(worldScale);

                            // Remove from parent
                            mesh.remove(innerSphere);

                            // Apply world transforms
                            innerSphere.position.copy(worldPosition);
                            innerSphere.quaternion.copy(worldQuaternion);
                            innerSphere.scale.copy(worldScale);

                            // Remove outer mesh and replace with inner sphere
                            scene.remove(mesh);
                            meshes[i] = innerSphere;
                            scene.add(innerSphere);

                            // Mark as metallic only
                            isMetallicOnly[i] = true;

                            // Check if all three are now metallic only
                            if (isMetallicOnly[0] && isMetallicOnly[1] && isMetallicOnly[2] && !isAligning) {
                                // Start alignment animation
                                isAligning = true;
                                alignProgress = 0;

                                // Store starting positions
                                startPositions = [
                                    meshes[0].position.clone(),
                                    meshes[1].position.clone(),
                                    meshes[2].position.clone()
                                ];

                                // Set target positions (horizontal line)
                                targetPositions = [
                                    new THREE.Vector3(-2, 0, 0),   // Left
                                    new THREE.Vector3(0, 0, 0),    // Center
                                    new THREE.Vector3(2, 0, 0)     // Right
                                ];
                            }
                        } else {
                            // If no inner sphere, just hide outer mesh
                            mesh.visible = false;
                        }
                    } else {
                        // Update material opacity
                        mesh.material.opacity = fadeProgress[i] * 0.8; // Original opacity was 0.8
                    }
                }
            }

            // Animate aurora lights - wave-like movement with varying intensity
            for (let i = 0; i < auroraLights.length; i++) {
                const light = auroraLights[i];

                // Wave-like position animation - aurora effect
                const t = time * 0.5;
                light.position.x = Math.sin(t * light.userData.speedX + light.userData.phaseX) * 6;
                light.position.y = Math.cos(t * light.userData.speedY + light.userData.phaseY) * 4 +
                                   Math.sin(t * light.userData.speedY * 2) * 1.5;
                light.position.z = Math.sin(t * light.userData.speedZ + light.userData.phaseZ) * 2;

                // Pulsing intensity like aurora borealis
                const intensityWave1 = Math.sin(t * 1.5 + light.userData.intensityPhase);
                const intensityWave2 = Math.cos(t * 2.3 + light.userData.intensityPhase * 1.7);
                const baseIntensity = 0.3 + (intensityWave1 * 0.5 + 0.5) * 0.4;
                const flickerIntensity = (intensityWave2 * 0.5 + 0.5) * 0.3;

                light.intensity = baseIntensity + flickerIntensity;

                // Occasionally create bright flares
                const flareChance = Math.sin(time * 3 + i * 100);
                if (flareChance > 0.97) {
                    light.intensity += 0.5;
                }
            }

            // Camera looks at center
            camera.position.x = 0;
            camera.position.y = 0;
            camera.position.z = 5;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
